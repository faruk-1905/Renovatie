<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renovatiebudget</title><style>body{font:16px system-ui;background:#f4f6f8;color:#18252d;max-width:800px;margin: auto;padding:20px}section{background:white;border-radius:14px;padding:20px;margin:15px 0}input,button{font:inherit;padding:9px;border:1px solid #bbc4ca;border-radius:7px;min-width:0}button{cursor:pointer;background:#e8f0ee}label{display:block;margin:8px 0}.item{display:grid;grid-template-columns:24px minmax(0,1fr) 95px 36px;gap:6px;margin:8px 0;align-items:center}.item input{width:100%;box-sizing:border-box}h1,h2{margin:8px 0}small{color:#52616b}#status{white-space:pre-wrap} .sum{font-size:26px;font-weight:bold} [hidden]{display:none!important}</style><h1>Renovatiebudget</h1><section id="login"><label>Repository (eigenaar/naam)<input id="repo" placeholder="naam/renovatiebudget"></label><label>GitHub toegangstoken <input id="token" type="password" autocomplete="off"></label><button id="connect">Verbinden</button></section><p id="status" role="status">Niet verbonden</p><main id="app" hidden><section><button id="logout">Uitloggen</button> <button id="reload">Vernieuwen</button><p>Nog te betalen inclusief extra</p><div class="sum" id="top"></div></section><section><label>Filter <select id="filter"><option value="all">Alles</option><option value="open">Openstaand</option><option value="paid">Betaald</option></select></label><div id="rows"></div><form id="add"><input id="name" placeholder="Nieuwe aankoop" required><input id="amount" placeholder="Bedrag (€)" inputmode="decimal"><button>Toevoegen</button></form></section><section><label>Extra kosten (€) <input id="extra" inputmode="decimal"></label><div id="totals"></div><button id="backup">Back-up downloaden</button></section></main><script>
'use strict';const $=id=>document.getElementById(id),money=n=>n.toLocaleString('nl-BE',{style:'currency',currency:'EUR'});let data,sha,repo,token,busy=false;const status=s=>$('status').textContent=s;function cents(v){if(!String(v).trim())return null;let n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0||n>1e9)throw Error('Ongeldig bedrag');return Math.round(n*100)}const val=n=>n===null?'':String(n/100);const enc=o=>btoa(Array.from(new TextEncoder().encode(JSON.stringify(o,null,2)),b=>String.fromCharCode(b)).join(''));const dec=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));async function api(method='GET',body){let r=await fetch('https://api.github.com/repos/'+repo.split('/').map(encodeURIComponent).join('/')+'/contents/budget.json',{method,cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok){let e=Error('GitHub: '+r.status);e.code=r.status;throw e}return r.json()}
async function load(){let r=await api();data=dec(r.content);sha=r.sha;render();status('Online • laatste versie geladen')}
function render(){let paid=data.items.reduce((s,i)=>s+(i.paid?(i.cents||0):0),0),total=data.items.reduce((s,i)=>s+(i.cents||0),0),open=total-paid,extra=data.extra||0; $('top').textContent=money((open+extra)/100);$('extra').value=val(extra);$('totals').textContent='';for(let [k,v] of [['Alle aankopen',total],['Betaald',paid],['Openstaand',open],['Totale projectkosten',total+extra],['TOTAAL NOG TE BETALEN',open+extra]]){let p=document.createElement('p');p.textContent=k+': '+money(v/100);if(k.startsWith('TOTAAL'))p.className='sum';$('totals').append(p)}let p=document.createElement('small');p.textContent=data.items.filter(i=>!i.paid&&i.cents===null).length+' openstaande items zonder prijs';$('totals').append(p);$('rows').replaceChildren();for(let i of data.items.filter(i=>$('filter').value==='all'||($('filter').value==='paid'?i.paid:!i.paid))){let row=document.createElement('div');row.className='item';let c=document.createElement('input');c.type='checkbox';c.checked=i.paid;c.setAttribute('aria-label','Betaald: '+i.name);c.onchange=()=>edit(i.id,'paid',c.checked);let n=document.createElement('input');n.value=i.name;n.setAttribute('aria-label','Omschrijving');n.onchange=()=>edit(i.id,'name',n.value.trim());let a=document.createElement('input');a.value=val(i.cents);a.placeholder='Onbekend';a.inputMode='decimal';a.setAttribute('aria-label','Bedrag');a.onchange=()=>{try{edit(i.id,'cents',cents(a.value))}catch(e){status(e.message);render()}};let b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label','Verwijder '+i.name);b.onclick=()=>{if(confirm('Verwijderen?'))save('Aankoop verwijderd',d=>{let j=d.items.find(x=>x.id===i.id);if(JSON.stringify(j)!==JSON.stringify(i))throw Error('Item intussen gewijzigd');d.items=d.items.filter(x=>x.id!==i.id)})};row.append(c,n,a,b);$('rows').append(row)}}
function edit(id,k,v){let old=data.items.find(i=>i.id===id)[k];if(old===v)return;if(k==='name'&&!v){render();return}save('Aankoop bijgewerkt',d=>{let i=d.items.find(x=>x.id===id);if(!i||i[k]!==old)throw Error('Dezelfde waarde is intussen gewijzigd. Probeer opnieuw.');i[k]=v})}
async function save(message,mutate){if(busy)return;busy=true;$('app').inert=true;status('Bezig met opslaan…');try{for(let attempt=0;attempt<3;attempt++){let r=await api(),d=dec(r.content);mutate(d);try{await api('PUT',{message,content:enc(d),sha:r.sha});await load();status('Alle wijzigingen opgeslagen');return}catch(e){if(e.code!==409||attempt===2)throw e}}}catch(e){try{await load()}catch{}status('Opslag niet bevestigd: '+e.message+' — controleer en probeer opnieuw.')}finally{busy=false;$('app').inert=false;render()}}
$('connect').onclick=async()=>{repo=$('repo').value.trim();token=$('token').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token)return status('Vul repository en token in');$('connect').disabled=true;try{await load();$('login').hidden=true;$('app').hidden=false;$('token').value=''}catch(e){status(e.message);token=''}finally{$('connect').disabled=false}};$('logout').onclick=()=>location.reload();$('reload').onclick=()=>load().catch(e=>status(e.message));$('filter').onchange=render;$('extra').onchange=()=>{try{let v=cents($('extra').value)||0,old=data.extra;if(v!==old)save('Extra budget bijgewerkt',d=>{if(d.extra!==old)throw Error('Extra budget intussen gewijzigd');d.extra=v})}catch(e){status(e.message);render()}};$('add').onsubmit=e=>{e.preventDefault();try{let i={id:crypto.randomUUID(),name:$('name').value.trim(),cents:cents($('amount').value),paid:false};if(!i.name)return;save('Aankoop toegevoegd',d=>d.items.push(i));$('name').value='';$('amount').value=''}catch(e){status(e.message)}};$('backup').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='budget-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};setInterval(()=>{if(data&&!busy&&!$('app').contains(document.activeElement))load().catch(e=>status(e.message))},20000);window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue=''}});
</script></html>
